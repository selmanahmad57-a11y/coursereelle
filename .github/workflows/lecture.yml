# Lecture des captures en attente, et verdicts.
#
# POURQUOI ICI ET NON DANS UNE FONCTION. Mesuré en production le 4 septembre
# 2026 : la route /api/taches/lecture expirait au bout des trois cents secondes
# accordées à une fonction, sans qu'aucune course soit en attente — c'est
# l'initialisation du moteur qui ne passe pas, pas le volume. L'hypothèse du
# compilateur qui ne suivrait pas les fichiers du moteur a été testée et
# écartée. Cette tâche a donc besoin d'un vrai environnement Node, avec un
# disque inscriptible et sans limite de durée : c'est ce qu'est un exécuteur
# GitHub.
#
# CE QUE CELA IMPLIQUE, ET QUI EST PUBLIÉ. La capture transite par cet
# exécuteur le temps de sa lecture. La machine est jetable et ne conserve rien,
# mais elle n'est pas dans l'Union européenne, alors que le stockage l'est. La
# page Méthode et les mentions légales le disent — une limite annoncée avant
# qu'un lecteur attentif la trouve.
#
# Le secret des identifiants est confié au dépôt. GitHub ne les expose pas aux
# workflows venus d'une bifurcation, et les actions employées ici sont
# épinglées.

name: Lecture des captures

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Deux lectures simultanées liraient les mêmes courses en attente et rendraient
# deux fois le même verdict.
concurrency:
  group: lecture-des-captures
  cancel-in-progress: false

jobs:
  lecture:
    # Image épinglée le 6 octobre 2026, pour traverser la migration
    # ubuntu-latest → Ubuntu 26 annoncée au 19 octobre 2026.
    #
    # POURQUOI. Le moteur de lecture repose sur des binaires natifs — sharp, et
    # ceux de tesseract.js. Une image qui changerait sous nos pieds casserait la
    # lecture sans préavis, et se manifesterait comme la pénurie de machines du
    # 5 octobre : des passages rouges que personne n'annonce — mais cette fois
    # avec de vraies courses derrière, le test fermé ayant commencé.
    #
    # QUAND LA RETIRER. Après le test fermé, un jour calme, délibérément : on
    # repasse sur l'image suivante et on vérifie que sharp et tesseract lisent
    # encore, par un passage de contrôle. La migration devient alors une
    # décision, au lieu d'être une date subie.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Les donnees de langue du moteur, gardees d'un passage a l'autre.
      #
      # Sans ce cache, chaque passage les retelecharge depuis le CDN de
      # tesseract.js : pres de cent dependances reseau par jour, et un point de
      # defaillance exterieur au pipeline de verdict. C'est precisement ce qui a
      # echoue le 29 septembre 2026.
      #
      # La cle porte la version du moteur : une montee de version invalide le
      # cache au lieu de servir les donnees d'une autre epoque.
      #
      # NE PAS CREER LE DOSSIER A L'AVANCE. Un passage a vide ne demarre plus le
      # moteur, donc ne telecharge rien : le dossier reste absent et aucune
      # entree n'est ecrite. Le creer vide ferait enregistrer un cache vide sous
      # cette cle, qui repondrait « trouve » a tous les passages suivants — et
      # les donnees reelles ne seraient jamais mises en cache.
      - name: Version du moteur de lecture
        id: moteur
        run: |
          echo "version=$(node -p "require('./node_modules/tesseract.js/package.json').version")" >> "$GITHUB_OUTPUT"

      # v6 et non v4 : la v4 tourne sur le runtime Node 20, que GitHub declare
      # deprecie — l'executeur la forcait deja sur Node 24 en l'annoncant.
      - uses: actions/cache@v6
        with:
          path: cache-moteur
          key: moteur-lecture-${{ runner.os }}-tesseract-${{ steps.moteur.outputs.version }}

      - name: Lire les captures en attente
        run: npm run lecture:direct
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_JURIDICTION: ${{ secrets.R2_JURIDICTION }}
