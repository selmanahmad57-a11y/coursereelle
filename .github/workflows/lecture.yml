# Lecture des captures en attente, et verdicts.
#
# Le filtre 2 est différé exprès : un échec de lecture ne doit jamais faire
# échouer un envoi par ailleurs valide. Ce report n'a de sens que si quelque
# chose reprend le travail sans qu'on le lui demande — sinon les courses
# resteraient « en attente » indéfiniment, ce qui reviendrait à ne jamais rendre
# de verdict.
#
# Un quart d'heure est le compromis : un livreur qui publie entre deux courses
# voit son verdict avant la fin de sa journée, sans qu'une fonction démarre pour
# rien quand il n'y a rien à lire — la route ne fait aucun travail lorsque la
# file est vide.
#
# CADENCE SUSPENDUE : LA PORTE NE S'OUVRE PAS ENCORE.
#
# Mesuré en production le 4 septembre 2026 : /api/taches/lecture expire au bout
# de 300 s — la durée maximale d'une fonction — alors qu'aucune course n'était en
# attente. Ce n'est donc pas le lot qui est trop grand : c'est le moteur de
# reconnaissance qui ne parvient pas à démarrer dans une fonction serverless.
# Lui donner un quart d'heure de plus n'y changerait rien, et une planification
# qui échoue toutes les quinze minutes est pire qu'une absence de planification :
# elle donne l'apparence d'un mécanisme.
#
# Le déclenchement manuel reste, pour pouvoir reconstater. La cadence reviendra
# quand la lecture aura un endroit où tourner — soit ici même, en exécutant la
# commande plutôt qu'en appelant la route, soit dans la fonction si les données
# de langue y sont embarquées.

name: Lecture des captures

on:
  workflow_dispatch:

jobs:
  lecture:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher la lecture des captures en attente
        run: |
          reponse=$(curl --silent --show-error --fail-with-body \
            --max-time 300 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/taches/lecture")
          echo "$reponse"
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
