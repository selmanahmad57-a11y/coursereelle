# Lecture des captures en attente, et verdicts.
#
# POURQUOI ICI ET NON DANS UNE FONCTION. Mesuré en production le 4 septembre
# 2026 : la route /api/taches/lecture expirait au bout des trois cents secondes
# accordées à une fonction, sans qu'aucune course soit en attente — c'est
# l'initialisation du moteur qui ne passe pas, pas le volume. L'hypothèse du
# compilateur qui ne suivrait pas les fichiers du moteur a été testée et
# écartée. Cette tâche a donc besoin d'un vrai environnement Node, avec un
# disque inscriptible et sans limite de durée : c'est ce qu'est un exécuteur
# GitHub.
#
# CE QUE CELA IMPLIQUE, ET QUI EST PUBLIÉ. La capture transite par cet
# exécuteur le temps de sa lecture. La machine est jetable et ne conserve rien,
# mais elle n'est pas dans l'Union européenne, alors que le stockage l'est. La
# page Méthode et les mentions légales le disent — une limite annoncée avant
# qu'un lecteur attentif la trouve.
#
# Le secret des identifiants est confié au dépôt. GitHub ne les expose pas aux
# workflows venus d'une bifurcation, et les actions employées ici sont
# épinglées.

name: Lecture des captures

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Deux lectures simultanées liraient les mêmes courses en attente et rendraient
# deux fois le même verdict.
concurrency:
  group: lecture-des-captures
  cancel-in-progress: false

jobs:
  lecture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lire les captures en attente
        run: npm run lecture:direct
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_JURIDICTION: ${{ secrets.R2_JURIDICTION }}
